<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Music Quiz App</title>
<link rel="stylesheet" href="styles/style.css">
<style>
    body { font-family: Arial; text-align:center; }
    img { width:120px; cursor:pointer; margin:10px; }
    .selected { border:3px solid green; }
    .order-item {
        padding:8px;
        margin:5px;
        border:1px solid #000;
        cursor:pointer;
        display:inline-block;
    }
    .order-selected { background:lightgreen; }
</style>

</head>
<body>

<h2>Selecciona módulo</h2>

<select id="selectorModulo">
    <option value="">-- Seleccionar --</option>
    <option value="general">General</option>
    <option value="bateria">Batería</option>
    <option value="guitarra">Guitarra</option>
    <option value="piano">Piano</option>
    <option value="bajo">Bajo</option>
    <option value="tecnica_vocal">Técnica Vocal</option>
</select>

<hr>

<h1 id="tema"></h1>
<h3 id="preguntaTexto"></h3>

<div id="contenedor"></div>

<button id="btnConfirmar" disabled>Confirmar</button>

<script src="./js/sound.js"></script>
<script src="./js/style.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
